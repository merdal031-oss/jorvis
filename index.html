async function coz(sifre){
  const ham=await crypto.subtle.importKey("raw",new TextEncoder().encode(sifre),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(V.tuz),iterations:V.tur,hash:"SHA-256"},ham,{name:"AES-GCM",length:256},false,["decrypt"]);
  const acik=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(V.iv)},key,b64(V.veri));
  return new TextDecoder().decode(acik);
}
async function dene(sifre,sessiz){
  try{const html=await coz(sifre);try{localStorage.setItem("jorvis_s",sifre)}catch(e){}
      document.open();document.write(html);document.close();}
  catch(e){if(!sessiz)document.getElementById("h").textContent="Şifre yanlış.";}
}
document.getElementById("b").onclick=()=>dene(document.getElementById("s").value,false);
document.getElementById("s").onkeydown=e=>{if(e.key==="Enter")dene(e.target.value,false)};
